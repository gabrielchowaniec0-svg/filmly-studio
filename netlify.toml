# Filmly Studio is a zero-dependency static site (plain ES modules, no bundler).
# The only build step regenerates the asset manifest so new files in src/assets and films/ are picked up.
[build]
  command = "node scripts/build-manifest.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
